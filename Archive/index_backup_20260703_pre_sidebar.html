<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HRIS Team — Open Tickets</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f5f7fb;
      color: #1a1a2e;
      font-size: 14px;
    }

    .layout { display: flex; height: 100vh; overflow: hidden; }

    /* ===== SIDEBAR ===== */
    .sidebar { width: 310px; min-width: 310px; background: #002147; color: #fff; display: flex; flex-direction: column; height: 100vh; overflow-y: auto; overflow-x: hidden; }
    .sidebar::-webkit-scrollbar { width: 4px; }
    .sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 4px; }
    .sidebar-header { padding: 28px 24px 20px; border-bottom: 1px solid rgba(255,255,255,0.1); }
    .sidebar-wordmark { font-size: 0.78rem; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: rgba(255,255,255,0.5); margin-bottom: 6px; }
    .sidebar-title { font-size: 1.05rem; font-weight: 600; color: #fff; line-height: 1.3; }
    .sidebar-subtitle { font-size: 0.75rem; color: rgba(255,255,255,0.5); margin-top: 4px; }
    .sidebar-clock { padding: 16px 24px; border-bottom: 1px solid rgba(255,255,255,0.08); }
    .clock-time { font-size: 1.6rem; font-weight: 300; letter-spacing: 1px; font-variant-numeric: tabular-nums; color: #fff; }
    .clock-date { font-size: 0.72rem; color: rgba(255,255,255,0.45); margin-top: 3px; }
    .sidebar-section { padding: 18px 24px; border-bottom: 1px solid rgba(255,255,255,0.08); }
    .sidebar-section-label { font-size: 0.65rem; font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase; color: rgba(255,255,255,0.35); margin-bottom: 12px; }
    .queue-tile { background: rgba(255,255,255,0.07); border-radius: 8px; padding: 14px 16px; margin-bottom: 8px; }
    .queue-big { font-size: 2.2rem; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
    .queue-big-label { font-size: 0.7rem; color: rgba(255,255,255,0.5); text-transform: uppercase; letter-spacing: 0.6px; margin-top: 3px; margin-bottom: 12px; }
    .queue-row { display: flex; justify-content: space-between; align-items: center; padding: 5px 0; border-top: 1px solid rgba(255,255,255,0.07); font-size: 0.78rem; }
    .queue-row-label { color: rgba(255,255,255,0.6); }
    .queue-row-val { font-weight: 600; font-variant-numeric: tabular-nums; }
    .queue-row-val.amber { color: #f59e0b; }
    .queue-row-val.red { color: #ef4444; }
    .queue-updated { font-size: 0.68rem; color: rgba(255,255,255,0.3); margin-top: 10px; }
    .sidebar-btn { display: block; width: 100%; padding: 9px 14px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12); border-radius: 6px; color: #fff; font-size: 0.8rem; font-weight: 500; cursor: pointer; text-align: left; transition: background 0.15s; margin-bottom: 8px; }
    .sidebar-btn:hover { background: rgba(255,255,255,0.14); }
    .sidebar-btn-icon { margin-right: 8px; opacity: 0.7; }
    .sidebar-link { display: flex; align-items: center; gap: 8px; padding: 8px 0; color: rgba(255,255,255,0.65); text-decoration: none; font-size: 0.8rem; border-bottom: 1px solid rgba(255,255,255,0.05); transition: color 0.15s; }
    .sidebar-link:last-child { border-bottom: none; }
    .sidebar-link:hover { color: #fff; }
    .sidebar-link-dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.25); flex-shrink: 0; }
  </style>
</head>
<body>

name: Update HRIS Dashboard
# Triggered hourly during office hours, by the Refresh pill in the dashboard
# (workflow_dispatch via GitHub API), or manually from the Actions tab on GitHub.
on:
  workflow_dispatch:
  schedule:
    # Hourly, Mon-Fri. Cron is UTC: 7-16 UTC = 8am-5pm BST (7am-4pm GMT in winter).
    - cron: "0 7-16 * * 1-5"
permissions:
  contents: write   # needed to commit and push index.html
jobs:
  update:
    runs-on: self-hosted
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
      - name: Install Python dependencies
        run: |
          pip install playwright requests gitpython tzdata
          python -m playwright install chromium
          python -m playwright install-deps chromium
      - name: Run dashboard update
        env:
          # The runner is the same PC where 'Refresh Session.bat' (login.py)
          # saves session.json — read it straight off disk. No secret needed.
          # Checks every listed path and uses the newest session it finds.
          SAASIT_SESSION_FILE: C:\Users\admin\Documents\Claude\Projects\HRIS-Dashboard\session.json;C:\Users\admin\Documents\Claude\Projects\HRIS-Dashboard\hris-dashboard-local\session.json;C:\Users\admin\Documents\Claude\HRIS-Dashboard\session.json
          # Legacy fallback if the file is missing:
          SAASIT_SESSION: ${{ secrets.SAASIT_SESSION }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python generate_dashboard.py
      - name: Commit and push updated dashboard
        shell: powershell
        run: |
          git config user.name "HRIS Dashboard Bot"
          git config user.email "action@github.com"
          git add index.html
          git diff --staged --quiet
          if ($LASTEXITCODE -ne 0) {
            $ts = (Get-Date).ToUniversalTime().ToString("yyyy-MM-dd HH:mm") + " UTC"
            git commit -m "dashboard: auto-update $ts"
            git push https://${{ secrets.GITHUB_TOKEN }}@github.com/begb0037admin/hris-dashboard.git main
          }

name: Update HRIS Dashboard

# Triggered by the Refresh pill in the dashboard (workflow_dispatch via GitHub API)
# or manually from the Actions tab on GitHub.
on:
  workflow_dispatch:

permissions:
  contents: write   # needed to commit and push index.html

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          pip install playwright requests gitpython tzdata
          playwright install chromium
          playwright install-deps chromium

      - name: Run dashboard update
        env:
          SAASIT_SESSION: ${{ secrets.SAASIT_SESSION }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python generate_dashboard.py

      - name: Commit and push updated dashboard
        run: |
          git config user.name  "HRIS Dashboard Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet || (
            git commit -m "dashboard: auto-update $(date -u +'%Y-%m-%d %H:%M UTC')" &&
            git push
          )

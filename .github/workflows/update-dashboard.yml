name: Update HRIS Dashboard
# Hourly Mon-Fri 7am-4pm UTC (matches CLAUDE.md/README.md/HANDOVER.md's documented
# schedule -- re-added 11 Aug 2026 after being found missing entirely; the workflow
# had silently regressed to workflow_dispatch-only at some point, so the docs'
# "hourly cron" claim was false until this fix. Also still triggerable manually
# via the dashboard's Refresh button or the Actions tab.
on:
  schedule:
    - cron: '0 7-16 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: self-hosted
    env:
      # Runner checkout path is checked first — this is where Refresh Session.bat saves session.json.
      # Fallback paths kept for safety.
      SAASIT_SESSION_FILE: C:\actions-runner\_work\hris-dashboard\hris-dashboard\session.json;C:\Users\admin\Documents\Claude\Projects\HRIS-Dashboard\session.json;C:\Users\admin\Documents\Claude\Projects\HRIS-Dashboard\hris-dashboard-local\session.json;C:\Users\admin\Documents\Claude\HRIS-Dashboard\session.json
    steps:
      - name: Configure git safe directory
        shell: powershell
        run: git config --global --add safe.directory C:/actions-runner/_work/hris-dashboard/hris-dashboard
      - name: Check out repo
        uses: actions/checkout@v4
      - name: Install Python dependencies
        run: |
          pip install playwright requests gitpython tzdata
          python -m playwright install chromium
          python -m playwright install-deps chromium
      - name: Run dashboard update
        env:
          SAASIT_SESSION: ${{ secrets.SAASIT_SESSION }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python generate_dashboard.py
      - name: Commit and push updated dashboard
        shell: powershell
        run: |
          git config user.name "HRIS Dashboard Bot"
          git config user.email "action@github.com"
          git add index.html
          git diff --staged --quiet
          if ($LASTEXITCODE -ne 0) {
            $ts = (Get-Date).ToUniversalTime().ToString("yyyy-MM-dd HH:mm") + " UTC"
            git commit -m "dashboard: auto-update $ts"
            git push https://${{ secrets.GITHUB_TOKEN }}@github.com/begb0037admin/hris-dashboard.git main
          }
      - name: Publish run diagnostics
        if: always()
        shell: powershell
        run: |
          $lines = @()
          $lines += "run=$env:GITHUB_RUN_NUMBER event=$env:GITHUB_EVENT_NAME utc=$((Get-Date).ToUniversalTime().ToString('yyyy-MM-dd HH:mm:ss'))"
          $lines += "runner_user=$env:USERDOMAIN\$env:USERNAME"
          foreach ($p in ($env:SAASIT_SESSION_FILE -split ';')) {
            if (Test-Path $p) {
              try {
                $len = (Get-Content -Raw -ErrorAction Stop $p).Length
                $mt  = (Get-Item $p).LastWriteTime
                $lines += "session_file OK: $p (chars=$len, modified=$mt)"
              } catch {
                $lines += "session_file UNREADABLE: $p - $($_.Exception.Message)"
              }
            } else {
              $lines += "session_file MISSING (or runner cannot see it): $p"
            }
          }
          if (Test-Path dashboard_run.log) {
            $lines += "--- last 40 lines of dashboard_run.log ---"
            $lines += Get-Content dashboard_run.log -Tail 40
          } else {
            $lines += "dashboard_run.log not found (python step may not have started)"
          }
          Set-Content -Path last_run_status.txt -Value $lines -Encoding UTF8
          git config user.name "HRIS Dashboard Bot"
          git config user.email "action@github.com"
          git pull --no-edit https://${{ secrets.GITHUB_TOKEN }}@github.com/begb0037admin/hris-dashboard.git main
          git add last_run_status.txt
          git diff --staged --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "diagnostics: run $env:GITHUB_RUN_NUMBER"
            git push https://${{ secrets.GITHUB_TOKEN }}@github.com/begb0037admin/hris-dashboard.git main
          }
